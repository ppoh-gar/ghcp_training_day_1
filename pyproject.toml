[project]
name = "ghcp-training-ticket-desk"
version = "0.1.0"
description = "Ticket Desk sample application"
requires-python = ">=3.11"
dependencies = [
    "duckdb==1.5.5",
    "fastapi==0.141.1",
    "nicegui==3.16.0",
    "pydantic==2.13.5",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
